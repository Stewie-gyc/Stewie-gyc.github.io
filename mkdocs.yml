site_name: Stewie Griffin的小屋
site_description: Stewie 的个人成长与生活记录
site_author: Stewie
site_url: https://stewie-gyc.github.io/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

copyright: © 2026 Stewie

nav:
  - 主页: index.md
  - 目标: goals/index.md
  - 生活记录:
      - 生活随笔: life/index.md
  - 成长记录:
      - 进度: growth/index.md
      - 复盘: growth/review.md
  - 学习笔记:
      - 笔记首页: course/index.md
      - OpenFOAM 入门示例: course/example.md
  - 关于: about/index.md
  - 友链: friends/index.md