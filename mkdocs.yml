site_name: Stewie Griffin的小屋
site_description: 王帅（Stewie）的个人网站：CFD、OpenFOAM 与能源工程
site_author: 王帅（Stewie）
site_url: https://stewie-gyc.github.io/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

copyright: © 2026 王帅（Stewie）

nav:
  - 主页: index.md
  - 关于: about/index.md
  - 研究方向:
      - 研究概述: research/index.md
      - CFD-DEM 气固两相流: research/cfd-dem.md
      - 风能与风电场: research/wind-energy.md
      - GPU 计算与机器学习: research/gpu-ai.md
  - 学习笔记:
      - 笔记首页: course/index.md
      - OpenFOAM 入门示例: course/example.md
  - 学术成果: publications/index.md
  - 友链: friends/index.md
